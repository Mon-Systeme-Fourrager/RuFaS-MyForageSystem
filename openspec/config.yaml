schema: spec-driven

# Project context — shown to AI when creating OpenSpec artifacts (proposals, specs, tasks).
context: |
  RuFaS (Ruminant Farm Systems) — whole-dairy-farm biophysical simulation model in Python
  (animal, field/soil/crop, manure, feed-storage subsystems + an Economics/Energy/Emissions
  layer). Entry point main.py -> TaskManager.start(...), driven by input JSON.

  This is the MyForageSystem (MSF) FORK. It integrates on branch `dev-msf` and is NEVER
  merged back into upstream RuminantFarmSystems/RuFaS. Minimize divergence from upstream:
  isolate fork-only changes in their own files and avoid reformatting or editing large
  upstream-shared files, so re-syncing `dev-msf` with `RuFaS/dev` does not produce recurrent
  merge conflicts.

  Tooling (read the config FROM these files, do not hard-code): Python >=3.12,<3.14; Black
  (pyproject [tool.black], line-length 120); flake8 (.flake8: max-line 120, max-complexity 10,
  ignore E203,W503); mypy --strict (pyproject [tool.mypy]; CI ratchets the error count vs dev);
  Ruff (ruff.toml, complements flake8); pytest + coverage (.github/.coveragerc). Exact local
  commands: `black .`, `flake8 .`, `python -m mypy .`,
  `coverage run --rcfile=.github/.coveragerc && coverage report --rcfile=.github/.coveragerc`.

  Conventions: full type hints; NumPy-style docstrings + a unit test on every added/modified
  function; enums over string literals for domain values; named constants (in *_constants.py,
  with NRC reference) over magic numbers; None-safe config parsing (`is None`, not `or`). Full
  reference: docs/style_rules_explained.md. Do NOT "fix" accepted legacy style (scientific
  sigils, published coefficients, dict[str, Any] at JSON boundaries, god-object calculators).

  Hard gates: changelog.md is mandatory on every PR; protected input fixtures under input/
  (see .claude/rules/protected-inputs.md) must not be edited.

# Per-artifact rules.
rules:
  proposal:
    - Follow what / why / how; link the GitHub issue; keep it concise.
    - State the fork constraint: prefer changes that will not cause upstream-sync merge conflicts.
    - Large work (~1 engineer-month or more) needs a design doc first (rufas-design-doc skill).
  design:
    - Cover data structures, subsystem connection objects, and unit / mass-balance integrity.
  tasks:
    - Break work into small, TDD-able tasks (RED -> GREEN -> REFACTOR).
    - Each task keeps mypy strict clean, flake8 complexity <= 10, adds a NumPy docstring + test.
    - Never edit protected input fixtures; add a changelog.md entry for the change.
