# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration — MyForageSystem fork of RuFaS.
# Schema: https://coderabbit.ai/docs/reference/configuration
#
# Goal: make CodeRabbit enforce the recurring RuFaS review conventions that no linter
# expresses. The mechanical rules (formatting, complexity, imports, typing) are handled by
# the CI tools — black, flake8, mypy --strict — and are NOT restated here. The single
# source of truth for the conventions is the root CLAUDE.md and .claude/rules/style.md.
#
# (tone_instructions must be <= 250 chars; it carries the global fork guidance.)

language: en-US

tone_instructions: >-
  Concise: path:line — issue → fix. RuFaS MyForageSystem FORK, never merged upstream — flag
  churn causing recurrent merge conflicts on upstream sync. Judge only added/changed lines;
  never ask to fix untouched legacy.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # This fork integrates on dev-msf (its "dev"); review PRs targeting either.
    base_branches:
      - dev-msf
      - dev
  tools:
    # RuFaS uses black + flake8 + mypy, not ruff.
    ruff:
      enabled: false
  path_instructions:
    - path: "RUFAS/**/*.py"
      instructions: >-
        Enforce the RuFaS new-code conventions that no linter checks (source of truth:
        CLAUDE.md and .claude/rules/style.md), on added/changed lines only. Flag: (1)
        hard-coded scientific coefficients / magic numbers in RUFAS/biophysical/** or
        RUFAS/EEE/** — they must live in a *_constants.py with an NRC/published reference;
        (2) None-unsafe config parsing — require an explicit `is None` check, never
        `x.get(key) or default` (drops a real 0/0.0) and never `int(x.get(key))`/`float(...)`
        without a None guard; (3) raw string literals used as domain values — use the
        existing Enum instead (Enum == "str" is always False), in production AND tests;
        (4) methods returning a class-level dict/list/set without .copy()/deepcopy;
        (5) a missing NumPy-style docstring on any added/modified function. Do NOT flag
        accepted legacy style: scientific sigils (TDN, NEm, DMI, pH, ADG, BW), published
        SWAT/Parton/NRC coefficients, dict[str, Any] at JSON/config boundaries, god-object
        managers / ~20-parameter NRC calculators, class X(object), long exception messages.
    - path: "tests/**/*.py"
      instructions: >-
        Enforce RuFaS test conventions on added/changed lines. Flag: direct class-attribute
        mock assignment (`SomeClass.method = MagicMock()`) — require `mocker.patch.object`;
        tests that assert only return type / call_count instead of behaviour; missing
        `match=` on `pytest.raises`; class-state isolation that uses a shallow `dict()`
        instead of `copy.deepcopy`; raw string literals where a domain Enum exists; and a
        missing NumPy-style docstring on added fixtures/helpers/tests.
    - path: "!(RUFAS|tests)/**"
      instructions: >-
        This is a fork that never merges upstream. Prefer changes isolated in fork-specific
        files over edits to large upstream-shared files; flag unnecessary reformatting or
        churn that would create recurrent merge conflicts on the next upstream sync.
